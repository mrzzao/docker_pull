name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Move Docker storage to /mnt
      uses: ./.github/actions/maximize-disk-space
      with:
        enable-clean: true

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY

        # 读取第一行，确定架构
        ARCH=$(head -n 1 images.txt | tr -d '[:space:]')
        echo "架构标识：$ARCH"

        if [[ "$ARCH" == "amd" ]]; then
          ALIYUN_NAME_SPACE="githubimage"
          PLATFORM="linux/amd64"
        elif [[ "$ARCH" == "arm" ]]; then
          ALIYUN_NAME_SPACE="githubimage_arm"
          PLATFORM="linux/arm64"
        else
          echo "错误：images.txt 第一行必须是 amd 或 arm，实际为：$ARCH"
          exit 1
        fi

        echo "命名空间：$ALIYUN_NAME_SPACE"
        echo "平台：$PLATFORM"

        # 从第二行开始循环
        tail -n +2 images.txt | while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          echo "docker pull --platform $PLATFORM $line"
          docker pull --platform $PLATFORM $line
          # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
          image=$(echo "$line" | awk '{print $NF}')
          # 获取 镜像名:版本号  例如nginx:1.25.3
          image_name_tag=$(echo "$image" | sed 's#/#_#g')
          new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"
          echo "新镜像名称：$new_image"
          echo "docker tag $image $new_image"
          docker tag $image $new_image
          echo "docker push $new_image"
          docker push $new_image
        done
